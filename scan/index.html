<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>團體報到掃描</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="../config.js"></script>
<style>
  :root {
    --bg: #000; --ink: #fff; --muted: #a8a8a8; --field: #1f1f1f; --line: #3a3a3a;
    --ok: #008026; --dup: #ff8c00; --bad: #e40303;
    --font: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
  body { padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0); }
  main { max-width: 480px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 30px; font-weight: 900; margin: 12px 0 24px; }
  label { display: block; font-size: 15px; font-weight: 700; margin: 0 0 8px; }
  input {
    width: 100%; font: inherit; font-size: 18px; padding: 14px 16px; margin: 0 0 18px;
    border: 2px solid var(--line); border-radius: 10px; background: var(--field); color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--ink); }
  button {
    font: inherit; font-size: 18px; font-weight: 700; padding: 15px 18px;
    border: 0; border-radius: 10px; background: var(--ink); color: #000; cursor: pointer;
  }
  button:disabled { opacity: .5; }
  button.wide { width: 100%; }
  button:focus-visible { outline: 3px solid #4d7cff; outline-offset: 3px; }
  .err { color: #ff6b6b; font-weight: 500; min-height: 1.2em; margin: -4px 0 16px; }
  .pending { color: var(--ink); background: var(--field); border-radius: 10px; padding: 12px 14px; margin: 0 0 18px; line-height: 1.6; }

  .bar { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 0 14px; }
  .bar .station { font-size: 16px; color: var(--muted); }
  .bar .count { font-size: 22px; font-weight: 900; }
  .bar .count small { font-size: 15px; font-weight: 500; color: var(--muted); }
  .bar .count.stale { opacity: .5; }
  .sync { margin: -6px 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--field); color: var(--muted); font-size: 15px; line-height: 1.5; }
  .sync.bad { background: var(--bad); color: var(--ink); font-weight: 700; }
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 10;
    max-width: 448px; margin: 0 auto; padding: 16px 18px; border-radius: 12px;
    font-size: 17px; font-weight: 700; line-height: 1.5; background: var(--field); color: var(--ink); cursor: pointer;
  }
  .toast.dup { background: var(--dup); color: #000; }
  .toast.bad { background: var(--bad); }
  #reader { width: 100%; border-radius: 14px; overflow: hidden; background: #111; min-height: 280px; }
  #reader video { border-radius: 14px; }
  .camErr { color: var(--muted); line-height: 1.7; padding: 16px 4px; }
  .snap { display: block; text-align: center; margin: 14px 0 0; padding: 18px; border-radius: 12px; background: var(--ink); color: #000; font-size: 20px; font-weight: 900; cursor: pointer; }
  .manual { display: flex; gap: 10px; margin-top: 16px; }
  .manual input { margin: 0; text-transform: uppercase; letter-spacing: .08em; }
  .manual button { flex: none; }
  .logout { background: transparent; color: var(--muted); font-size: 15px; font-weight: 500; padding: 14px 0; }

  /* 結果覆蓋層 */
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 28px) 28px calc(env(safe-area-inset-bottom, 0px) + 28px);
    text-align: center; cursor: pointer;
  }
  #overlay.wait { background: rgba(0, 0, 0, .85); cursor: default; }
  #overlay.ok { background: var(--ok); }
  #overlay.dup { background: var(--dup); color: #000; }
  #overlay.bad { background: var(--bad); }
  #overlay.retry { cursor: default; }
  #oTitle { font-size: 44px; font-weight: 900; margin: 0 0 18px; }
  #oTeam { font-size: 20px; font-weight: 700; margin: 0 0 6px; opacity: .9; }
  #oName { font-size: 30px; font-weight: 700; line-height: 1.35; margin: 0 0 14px; word-break: break-word; }
  #oMeta { font-size: 18px; font-weight: 500; opacity: .85; margin: 0; line-height: 1.6; }
  #oHint { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); font-size: 15px; opacity: .7; }
  .oActions { display: flex; flex-direction: column; gap: 12px; margin: 28px auto 0; width: 100%; max-width: 360px; }
  .oActions button { width: 100%; font-size: 22px; font-weight: 900; padding: 18px; }
  .oActions .ghost { background: transparent; color: var(--ink); border: 2px solid rgba(255, 255, 255, .7); font-size: 18px; font-weight: 700; padding: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="loginView">
    <p style="color:var(--muted);margin:0" id="eventName"></p>
    <h1>團體報到掃描</h1>
    <p class="pending" id="pendingNote" hidden></p>
    <label for="pin">工作人員密碼</label>
    <input id="pin" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="staff">你的名字</label>
    <input id="staff" placeholder="會記錄在報到紀錄中">
    <p class="err" id="loginErr" role="alert"></p>
    <button class="wide" id="loginBtn">開始掃描</button>
  </section>

  <section id="scanView" hidden>
    <div class="bar">
      <span class="station" id="stationLabel"></span>
      <span class="count" id="count">– <small>/ –</small></span>
    </div>
    <p class="sync" id="sync" hidden></p>
    <div id="reader"></div>
    <p class="camErr" id="camErr" hidden>這個瀏覽器無法直接開啟即時鏡頭，請點下方「拍照掃描」，或手動輸入團體代碼。</p>
    <label class="snap" for="snapInput">拍照掃描</label>
    <input id="snapInput" type="file" accept="image/*" capture="environment" hidden>
    <div id="fileReader" hidden></div>
    <div class="manual">
      <input id="manualCode" placeholder="輸入團體代碼" autocapitalize="characters" autocomplete="off">
      <button id="manualBtn">報到</button>
    </div>
    <button class="logout" id="logout">登出</button>
  </section>
</main>

<div class="toast" id="toast" hidden role="alert"></div>

<div id="overlay" hidden role="alert">
  <p id="oTitle"></p>
  <p id="oTeam"></p>
  <p id="oName"></p>
  <p id="oMeta"></p>
  <div class="oActions" id="oActions" hidden>
    <button id="retryBtn">重送</button>
    <button class="ghost" id="skipBtn">略過，繼續掃描</button>
  </div>
  <p id="oHint">點一下繼續掃描</p>
</div>

<script>
  /* ---------- 設定 ---------- */
  // API 網址與活動名稱在 ../config.js（團體頁與掃描頁共用）
  const CONFIG = {
    API_URL: window.SITE_CONFIG.API_URL,
    EVENT_NAME: window.SITE_CONFIG.EVENT_NAME,
    DEDUPE_MS: 4000,        // 同一個代碼多久內不重複送出
    TIMEOUT_MS: 20000,      // 單次請求逾時；Apps Script 閒置後第一次呼叫要先喚醒，可能超過 8 秒
    FAST_TIMEOUT_MS: 6000,  // 畫面上等待中的逐筆報到：正常 1–3 秒，卡住就快點重試
    HEDGE_MS: 2500,         // 查詢類請求多久沒回就再送一個（見 apiRace）
    TRIES: 3,               // 每個請求最多嘗試幾次
    REFRESH_SECONDS: 30,    // 多久重新下載一次名單
    SYNC_RETRY_MS: 5000,    // 背景同步失敗後多久再試
  };

  const $ = id => document.getElementById(id);
  const KEY = 'twpride_checkin_staff';
  const QKEY = 'twpride_checkin_queue';
  let session = null, scanner = null, busy = false, lastCode = '', lastAt = 0, hideTimer = null;
  let retryCode = '', wakeLock = null, leaving = false;

  // 名單：代碼 → { code, name, team, done, time }。null 表示伺服器不支援，改用逐筆連線報到
  let roster = null;
  // 待同步的報到（存在 localStorage，關掉頁面也不會遺失）
  let queue = [];
  // 剛同步完成的代碼，避免名單下載時間差把它們又變回未報到
  const synced = new Map();
  let flushing = false, flushTimer = null, syncErr = '';

  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} },
    clear() { try { localStorage.removeItem(KEY); } catch (e) {} },
  };

  /* ---------- 代碼解析：新網址 ?code=、舊網址 ?page=scan&code=、純代碼 ---------- */
  function parseCode(raw) {
    const s = String(raw || '').trim();
    const m = s.match(/[?&]code=([^&#]+)/);
    let v = m ? m[1] : s;
    try { v = decodeURIComponent(v); } catch (e) {}
    return v.trim().toUpperCase();
  }

  /* ---------- Apps Script API ---------- */
  // 失敗時丟出的 Error 帶有 detail（例如 HTTP 404、逾時），會顯示在錯誤訊息後方方便回報
  async function apiOnce(action, data, timeoutMs, ctrl) {
    ctrl = ctrl || new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs || CONFIG.TIMEOUT_MS);
    let res, text;
    try {
      res = await fetch(CONFIG.API_URL, {
        method: 'POST',
        // text/plain 不會觸發 CORS 預檢
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action }, data)),
        redirect: 'follow',
        signal: ctrl.signal,
      });
      text = await res.text();
    } catch (e) {
      throw apiError(e && e.name === 'AbortError' ? '逾時' : '網路 ' + ((e && e.message) || e));
    } finally {
      clearTimeout(t);
    }
    if (!res.ok) throw apiError('HTTP ' + res.status);
    try { return JSON.parse(text); } catch (e) { throw apiError('回應格式錯誤'); }
  }

  function apiError(detail) { const e = new Error(detail); e.detail = detail; return e; }

  // Google 偶爾會在把請求交給 Apps Script 前卡住 15～30 秒（程式本身只跑 1 秒內），而且常常連續好幾次。
  // 前一個請求 CONFIG.HEDGE_MS 內沒回就再送一個相同的，誰先回用誰：最多同時 5 個、總共 8 個、持續 45 秒。
  // 只用在重複送出也安全的動作：查詢類，以及背景同步的報到（伺服器會擋下重複報到）。
  const RACE = { MAX_PARALLEL: 5, MAX_SENDS: 8, DEADLINE_MS: 45000 };
  function apiRace(action, data) {
    return new Promise((resolve, reject) => {
      const ctrls = [], started = Date.now();
      let settled = false, running = 0, sent = 0, lastErr = null, hedge = null;
      const end = (fn, v) => {
        if (settled) return;
        settled = true;
        clearTimeout(hedge); clearTimeout(deadline);
        ctrls.forEach(c => c.abort());
        fn(v);
      };
      const deadline = setTimeout(() => end(reject, lastErr || apiError('逾時')), RACE.DEADLINE_MS);
      const launch = () => {
        clearTimeout(hedge);
        if (settled) return;
        if (sent < RACE.MAX_SENDS && running < RACE.MAX_PARALLEL && Date.now() - started < RACE.DEADLINE_MS) {
          sent++; running++;
          const ctrl = new AbortController();
          ctrls.push(ctrl);
          apiOnce(action, data, CONFIG.TIMEOUT_MS, ctrl).then(v => end(resolve, v), e => { running--; lastErr = e; launch(); });
        }
        if (!running) { end(reject, lastErr); return; }
        hedge = setTimeout(launch, CONFIG.HEDGE_MS);
      };
      launch();
    });
  }

  // 失敗時自動重試。報到也可以重試：伺服器會擋下重複報到，回傳「已報到過」
  async function api(action, data, onRetry, timeoutMs) {
    for (let i = 1; ; i++) {
      try { return await apiOnce(action, data, timeoutMs); }
      catch (e) {
        if (i >= CONFIG.TRIES) throw e;
        if (onRetry) onRetry(i + 1);
        await new Promise(r => setTimeout(r, 500 * i));
      }
    }
  }

  /* ---------- 時間（HH:mm，臺北時間） ---------- */
  function nowHM() {
    return new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Taipei', hour12: false }).slice(0, 5);
  }
  function minutesApart(a, b) {
    const p = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || '')); return m ? +m[1] * 60 + +m[2] : NaN; };
    const d = Math.abs(p(a) - p(b));
    return isNaN(d) ? Infinity : Math.min(d, 1440 - d);
  }
  function isRecent(hhmm) { return minutesApart(hhmm, nowHM()) <= 2; }

  function errNote(e) { return e && e.detail ? '（' + e.detail + '）' : ''; }

  /* ---------- 登入 ---------- */
  async function login(s, fromSaved) {
    $('loginBtn').disabled = true;
    $('loginBtn').textContent = '連線中…';
    $('loginErr').textContent = '';
    let r;
    try {
      r = await apiRace('getRoster', { pin: s.pin });
      // 舊版後端沒有 getRoster：改用逐筆連線報到
      if (r.error === 'action') {
        const v = await apiRace('verifyPin', { pin: s.pin });
        r = v.ok ? { rows: null } : { error: 'pin' };
      }
    } catch (e) {
      $('loginBtn').disabled = false;
      $('loginBtn').textContent = '開始掃描';
      $('loginErr').textContent = '連線失敗，請確認網路後再按一次「開始掃描」。' + errNote(e);
      return;
    }
    $('loginBtn').disabled = false;
    $('loginBtn').textContent = '開始掃描';
    if (r.error === 'pin') {
      store.clear();
      if (!fromSaved) $('loginErr').textContent = '密碼不正確。';
      return;
    }
    if (r.error) {
      $('loginErr').textContent = '系統讀取失敗，請稍後再按一次「開始掃描」。（' + (r.message || r.error) + '）';
      return;
    }
    session = s;
    store.set(s);
    if (r.rows) applyRoster(r.rows);
    $('loginView').hidden = true;
    $('scanView').hidden = false;
    $('stationLabel').textContent = s.staff ? '經手人：' + s.staff : '';
    if (!roster) refresh();
    renderSync();
    flushQueue();
    keepAwake();
    startCamera();
    const pre = takeUrlCode();
    if (pre) submit(pre);
  }

  // 用手機內建相機掃描時，會帶著 ?code= 開啟這頁
  let urlCode = parseCode(new URLSearchParams(location.search).get('code') || '');
  function takeUrlCode() {
    const c = urlCode;
    urlCode = '';
    if (c) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
    $('pendingNote').hidden = true;
    return c;
  }

  /* ---------- 名單 ---------- */
  function applyRoster(rows) {
    roster = new Map(rows.map(g => [g.code, g]));
    const now = Date.now();
    synced.forEach((v, code) => { if (now - v.at > 180000) synced.delete(code); });
    // 尚未同步或剛同步完成的報到，以手機上的紀錄為準
    queue.concat([...synced.values()]).forEach(q => {
      const g = roster.get(q.code);
      if (g && !g.done) { g.done = true; g.time = q.time; }
    });
    updateCount();
  }

  function counts() {
    let done = 0;
    roster.forEach(g => { if (g.done) done++; });
    return { done, total: roster.size };
  }

  function updateCount() {
    if (!roster) return;
    const c = counts();
    setCount(c.done, c.total);
  }

  async function refresh() {
    if (!session) return;
    try {
      if (roster) {
        const r = await apiRace('getRoster', { pin: session.pin });
        if (r.error) throw new Error(r.error);
        applyRoster(r.rows);
      } else {
        const s = await apiRace('getStats', { pin: session.pin });
        if (s.error) throw new Error(s.error);
        setCount(s.done, s.total);
      }
    } catch (e) {
      $('count').classList.add('stale');   // 數字變淡表示暫時無法更新
    }
  }

  /* ---------- 鏡頭 ---------- */
  function startCamera() {
    if (scanner) return;
    try {
      scanner = new Html5Qrcode('reader', {
        verbose: false,
        formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      });
      scanner.start(
        { facingMode: 'environment' },
        { fps: 15, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.8); return { width: s, height: s }; } },
        onScan,
        () => {}
      ).then(() => { $('camErr').hidden = true; $('reader').hidden = false; }).catch(camFail);
    } catch (e) { camFail(); }
  }

  function onScan(text) {
    const code = parseCode(text);
    const now = Date.now();
    if (busy || !code || (code === lastCode && now - lastAt < CONFIG.DEDUPE_MS)) return;
    lastCode = code; lastAt = now;
    submit(code);
  }

  function camFail() {
    try { scanner && scanner.clear(); } catch (e) {}
    scanner = null;
    $('camErr').hidden = false; $('reader').hidden = true;
  }

  // iOS 切到其他 App 再回來時，鏡頭串流可能已中斷，需要重新啟動
  async function reviveCamera() {
    if (!scanner || !session) return;
    const v = document.querySelector('#reader video');
    const track = v && v.srcObject && v.srcObject.getVideoTracks ? v.srcObject.getVideoTracks()[0] : null;
    if (track && track.readyState === 'live') return;
    try { await scanner.stop(); } catch (e) {}
    try { scanner.clear(); } catch (e) {}
    scanner = null;
    startCamera();
  }

  function pauseCamera() { try { scanner && scanner.getState() === Html5QrcodeScannerState.SCANNING && scanner.pause(true); } catch (e) {} }
  function resumeCamera() { try { scanner && scanner.getState() === Html5QrcodeScannerState.PAUSED && scanner.resume(); } catch (e) {} }

  /* ---------- 螢幕常亮 ---------- */
  async function keepAwake() {
    if (!('wakeLock' in navigator) || !session || document.hidden) return;
    if (wakeLock && !wakeLock.released) return;
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* 不支援或被拒絕時略過 */ }
  }

  /* ---------- 報到 ---------- */
  function submit(raw) {
    const code = parseCode(raw);
    if (busy || !session || !code) return;
    busy = true;
    pauseCamera();
    // 名單上有的代碼：立刻顯示結果，背景寫入試算表
    if (roster && roster.has(code)) quickCheckIn(code);
    // 名單上沒有（可能是剛新增的團體）或後端不支援名單：逐筆連線確認
    else send(code);
  }

  function quickCheckIn(code) {
    const g = roster.get(code);
    if (g.done) {
      showResult({ result: 'dup', name: g.name, team: g.team, time: g.time });
      return;
    }
    const time = nowHM();
    g.done = true; g.time = time;
    queue.push({ code: code, staff: session.staff, time: time });
    saveQueue();
    flushQueue();
    const c = counts();
    showResult({ result: 'ok', name: g.name, team: g.team, time: time, done: c.done, total: c.total });
  }

  // 逐筆連線報到（名單上沒有的代碼）
  async function send(code, afterFailure) {
    showWait();
    let r;
    try {
      let retried = !!afterFailure;
      r = await api('checkIn', { pin: session.pin, code: code, staff: session.staff }, n => {
        retried = true;
        $('oTitle').textContent = '報到中…';
        $('oMeta').textContent = '連線較慢，重試中（' + n + '/' + CONFIG.TRIES + '）';
      }, CONFIG.FAST_TIMEOUT_MS);
      // 重試後才回「已報到過」且時間在 2 分鐘內：是前一次請求其實已寫入，只是回應沒收到
      if (retried && r.result === 'dup' && isRecent(r.time)) {
        r = { result: 'ok', name: r.name, team: r.team, time: r.time, confirmed: true };
      }
      if (r.error) r = { result: 'error', code: code, detail: r.message || r.error };
    } catch (e) {
      r = { result: 'net', code: code, detail: e.detail || '' };
    }
    if (roster && (r.result === 'ok' || r.result === 'dup')) {
      roster.set(code, { code: code, name: r.name, team: r.team, done: true, time: r.time });
      if (r.result === 'ok') { const c = counts(); r.done = c.done; r.total = c.total; r.confirmed = false; }
    } else if (r.confirmed) {
      refresh();
    }
    showResult(r);
  }

  /* ---------- 背景同步 ---------- */
  function loadQueue() {
    try { const q = JSON.parse(localStorage.getItem(QKEY) || '[]'); return Array.isArray(q) ? q : []; } catch (e) { return []; }
  }
  function saveQueue() {
    try { localStorage.setItem(QKEY, JSON.stringify(queue)); } catch (e) {}
    renderSync();
  }

  async function flushQueue() {
    if (flushing || !session) return;
    flushing = true;
    clearTimeout(flushTimer);
    try {
      while (queue.length) {
        const item = queue[0];
        let r;
        try {
          r = await apiRace('checkIn', { pin: session.pin, code: item.code, staff: item.staff });
        } catch (e) {
          r = { error: e.detail || '連線失敗' };
        }
        if (r.result === 'pin') { showResult({ result: 'pin' }); return; }
        if (r.error) {
          syncErr = r.message || r.error;
          renderSync();
          flushTimer = setTimeout(flushQueue, CONFIG.SYNC_RETRY_MS);
          return;
        }
        queue.shift();
        syncErr = '';
        saveQueue();
        settle(item, r);
      }
    } finally {
      flushing = false;
    }
  }

  // 同步結果和手機上顯示的不同時才提醒
  function settle(item, r) {
    const g = roster && roster.get(item.code);
    if (r.result === 'ok' || r.result === 'dup') {
      synced.set(item.code, { code: item.code, time: r.time, at: Date.now() });
      if (g) g.time = r.time;
      // 已報到過、且時間和這次掃描差超過 2 分鐘：在這之前就有人報到了
      if (r.result === 'dup' && minutesApart(r.time, item.time) > 2) {
        toast('⚠️ ' + (r.name || item.code) + ' 其實在 ' + r.time + ' 就已報到過', 'dup');
      }
    } else {
      if (g) { g.done = false; g.time = ''; }
      toast('❌ ' + item.code + ' 查無此代碼，這筆報到沒有寫入試算表', 'bad');
    }
    updateCount();
  }

  function renderSync() {
    const el = $('sync');
    if (!el) return;
    el.hidden = !queue.length;
    el.classList.toggle('bad', !!syncErr);
    el.textContent = !queue.length ? ''
      : syncErr ? '⚠️ 待同步 ' + queue.length + ' 筆：連線失敗，自動重試中（' + syncErr + '）'
      : '待同步 ' + queue.length + ' 筆，寫入試算表中…';
  }

  let toastTimer = null;
  function toast(text, kind) {
    const el = $('toast');
    el.textContent = text;
    el.className = 'toast ' + (kind || '');
    el.hidden = false;
    buzz([200, 100, 200]);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 8000);
  }

  /* ---------- 結果畫面 ---------- */
  function showWait() {
    clearTimeout(hideTimer);
    const o = $('overlay');
    o.className = 'wait';
    $('oTitle').textContent = '報到中…';
    $('oTeam').textContent = ''; $('oName').textContent = ''; $('oMeta').textContent = '';
    $('oActions').hidden = true; $('oHint').hidden = true;
    o.hidden = false;
  }

  function showResult(r) {
    const o = $('overlay');
    o.className = '';
    let title = '', name = '', meta = '', team = teamLabel(r.team), retry = false;
    if (r.result === 'ok') {
      o.classList.add('ok'); title = '✅ 報到完成'; name = r.name;
      if (r.confirmed) { meta = r.time + ' 報到'; }
      else { meta = r.time + ' 報到　目前 ' + r.done + ' / ' + r.total; setCount(r.done, r.total); }
      buzz([120]);
    } else if (r.result === 'dup') {
      o.classList.add('dup'); title = '⚠️ 已報到過'; name = r.name; meta = r.time + ' 已完成報到';
      buzz([80, 80, 80]);
    } else if (r.result === 'pin') {
      o.classList.add('bad'); title = '密碼已變更'; meta = '請重新登入';
      store.clear(); leaving = true; setTimeout(() => location.reload(), 1500);
    } else if (r.result === 'unread') {
      o.classList.add('bad'); title = '讀不到 QR Code'; meta = '請靠近一點、對準 QR Code 再拍一次';
      buzz([300]);
    } else if (r.result === 'net' || r.result === 'error') {
      o.classList.add('bad', 'retry');
      title = r.result === 'net' ? '連線失敗' : '讀取失敗';
      name = r.code || '';
      meta = (r.result === 'net' ? '這筆報到還沒有送出成功，請確認網路後按「重送」。' : '系統忙碌，這筆報到還沒有完成，請按「重送」。')
        + (r.detail ? '（' + r.detail + '）' : '');
      retry = true; retryCode = r.code || '';
      buzz([300, 100, 300]);
    } else {
      o.classList.add('bad'); title = '❌ 查無此代碼'; name = r.code || ''; meta = '請確認是否為本屆的報到 QR Code';
      buzz([300]);
    }
    $('oTitle').textContent = title;
    $('oTeam').textContent = team;
    $('oName').textContent = name;
    $('oMeta').textContent = meta;
    $('oActions').hidden = !retry;
    $('oHint').hidden = retry;
    o.hidden = false;
    clearTimeout(hideTimer);
    // 連線失敗時不自動關閉，避免這筆報到被默默略過
    if (!retry) hideTimer = setTimeout(dismiss, r.result === 'ok' ? 1200 : 3000);
  }

  function dismiss() {
    clearTimeout(hideTimer);
    $('overlay').hidden = true;
    retryCode = '';
    busy = false;
    lastAt = Date.now();   // 從恢復掃描起算，避免同一張 QR Code 還在鏡頭前又被送出
    resumeCamera();
  }

  function buzz(p) { if (navigator.vibrate) navigator.vibrate(p); }
  // 試算表的大隊欄可能只寫「黃色」或「黃」，顯示時一律補成「黃色大隊」
  function teamLabel(team) {
    const t = String(team || '').trim();
    if (!t || /大隊|team/i.test(t)) return t;
    if (/^[紅橙橘黃綠藍紫]$/.test(t)) return t + '色大隊';
    return t + '大隊';
  }
  function setCount(d, t) {
    $('count').classList.remove('stale');
    $('count').innerHTML = d + ' <small>/ ' + t + '</small>';
  }

  /* ---------- 事件 ---------- */
  $('overlay').addEventListener('click', () => {
    const c = $('overlay').classList;
    if (c.contains('retry') || c.contains('wait')) return;
    dismiss();
  });
  $('retryBtn').addEventListener('click', e => { e.stopPropagation(); if (retryCode) send(retryCode, true); else dismiss(); });
  $('skipBtn').addEventListener('click', e => { e.stopPropagation(); dismiss(); });
  $('toast').addEventListener('click', () => { $('toast').hidden = true; });

  $('loginBtn').addEventListener('click', () => {
    const s = { pin: $('pin').value.trim(), staff: $('staff').value.trim() };
    if (!s.pin) { $('loginErr').textContent = '請輸入工作人員密碼。'; return; }
    login(s, false);
  });
  $('staff').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
  $('manualBtn').addEventListener('click', () => {
    const v = $('manualCode').value.trim();
    if (!v) return;
    $('manualCode').value = '';
    $('manualCode').blur();
    submit(v);
  });
  $('manualCode').addEventListener('keydown', e => { if (e.key === 'Enter') $('manualBtn').click(); });
  $('snapInput').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f || busy) return;
    try {
      const reader = new Html5Qrcode('fileReader', { verbose: false });
      const text = await reader.scanFile(f, false);
      submit(text);
    } catch (err) {
      showResult({ result: 'unread' });
    }
  });
  $('logout').addEventListener('click', async () => {
    // 還有報到沒寫進試算表時不能登出，以免遺失
    if (queue.length) {
      toast('還有 ' + queue.length + ' 筆報到尚未寫入試算表，請等同步完成再登出', 'bad');
      flushQueue();
      return;
    }
    store.clear();
    leaving = true;
    try { wakeLock && await wakeLock.release(); } catch (e) {}
    try { scanner && await scanner.stop(); } catch (e) {}
    location.replace(location.pathname);
  });
  // 關閉或重新整理頁面時，若還有待同步的報到就提醒
  window.addEventListener('beforeunload', e => {
    if (leaving || !queue.length) return;
    e.preventDefault();
    e.returnValue = '';
  });
  window.addEventListener('online', () => flushQueue());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !session) return;
    keepAwake();
    reviveCamera();
    flushQueue();
    refresh();
  });
  setInterval(refresh, CONFIG.REFRESH_SECONDS * 1000);

  /* ---------- 啟動 ---------- */
  $('eventName').textContent = CONFIG.EVENT_NAME;
  queue = loadQueue();
  if (urlCode) {
    $('pendingNote').textContent = '登入後會自動報到：' + urlCode;
    $('pendingNote').hidden = false;
  }
  // 一打開頁面就先喚醒 Apps Script（閒置後第一次呼叫要 8 秒以上），輸入密碼時就醒好了
  const saved = store.get();
  if (!(saved && saved.pin)) apiOnce('getStatus', { code: '' }).catch(() => {});
  if (saved && saved.pin) {
    $('pin').value = saved.pin; $('staff').value = saved.staff || '';
    login(saved, true);
  }
</script>
</body>
</html>
