<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>團體報到 QR Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #5f6368;
    --line: #dcdcdc;
    --paper: #ffffff;
    --field: #f5f5f5;
    --r: #e40303; --o: #ff8c00; --y: #ffed00; --g: #008026; --b: #24408e; --p: #732982;
    --font: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); }
  body { padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0); }
  main { max-width: 440px; margin: 0 auto; padding: 32px 22px 48px; }

  .event { font-size: 15px; font-weight: 500; color: var(--muted); margin: 0 0 6px; }
  h1 { font-size: 40px; font-weight: 900; line-height: 1.15; margin: 0 0 28px; letter-spacing: .02em; }

  label { display: block; font-size: 15px; font-weight: 700; margin: 0 0 8px; }
  input {
    width: 100%; font: inherit; font-size: 18px; padding: 14px 16px; margin: 0 0 20px;
    border: 2px solid var(--line); border-radius: 10px; background: var(--field); color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--ink); background: #fff; }
  button {
    width: 100%; font: inherit; font-size: 18px; font-weight: 700; padding: 16px;
    border: 0; border-radius: 10px; background: var(--ink); color: #fff; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--b); outline-offset: 3px; }
  button:disabled { opacity: .5; }
  button.plain { background: transparent; color: var(--muted); font-weight: 500; font-size: 16px; margin-top: 12px; }
  .err { color: var(--r); font-weight: 500; margin: -6px 0 18px; min-height: 1em; }
  .note { font-size: 14px; color: var(--muted); line-height: 1.7; margin-top: 24px; }

  /* 通行證 */
  .pass { border: 2px solid var(--ink); border-radius: 18px; overflow: hidden; }
  .stripes { display: flex; flex-direction: column; }
  .stripes i { display: block; height: 10px; background: #e6e6e6; transition: background-color .5s ease; }
  .stripes i:nth-child(even) { background: #d4d4d4; }
  .pass-body { padding: 22px 22px 26px; text-align: center; }
  .team { display: inline-block; margin: 0 0 12px; padding: 6px 16px; border-radius: 999px; font-size: 16px; font-weight: 700; color: #fff; background: var(--ink); }
  .team.light { color: var(--ink); }
  .group-name { font-size: 24px; font-weight: 900; line-height: 1.35; margin: 0 0 18px; word-break: break-word; }
  #qr { display: inline-block; padding: 12px; background: #fff; border-radius: 8px; transition: opacity .4s; }
  #qr img, #qr canvas { display: block; width: 240px; height: 240px; }
  .code { font-size: 20px; font-weight: 700; letter-spacing: .12em; margin: 12px 0 0; }
  .status { font-size: 17px; font-weight: 500; margin: 18px 0 0; color: var(--muted); }

  .done .stripes i:nth-child(1) { background: var(--r); }
  .done .stripes i:nth-child(2) { background: var(--o); transition-delay: .08s; }
  .done .stripes i:nth-child(3) { background: var(--y); transition-delay: .16s; }
  .done .stripes i:nth-child(4) { background: var(--g); transition-delay: .24s; }
  .done .stripes i:nth-child(5) { background: var(--b); transition-delay: .32s; }
  .done .stripes i:nth-child(6) { background: var(--p); transition-delay: .40s; }
  .done #qr { opacity: .18; }
  .done .status { color: var(--g); font-size: 30px; font-weight: 900; }
  .done .status small { display: block; font-size: 16px; font-weight: 500; color: var(--muted); margin-top: 4px; }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .stripes i, #qr { transition: none !important; } }
</style>
</head>
<body>
<main>
  <p class="event" id="eventName"></p>

  <section id="formView">
    <h1>團體報到</h1>
    <label for="name">團體名稱</label>
    <input id="name" autocomplete="off" placeholder="請輸入報名時填寫的團體名稱">
    <label for="email">報名 Email</label>
    <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com">
    <p class="err" id="err" role="alert"></p>
    <button id="go">顯示報到 QR Code</button>
    <p class="note">請在報到處向工作人員出示 QR Code。報到完成後，這個畫面會自動變成「已完成報到」。</p>
  </section>

  <section id="passView" hidden>
    <div class="pass" id="pass">
      <div class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="pass-body">
        <p class="team" id="gTeam" hidden></p>
        <p class="group-name" id="gName"></p>
        <div id="qr" aria-label="報到 QR Code"></div>
        <p class="code" id="gCode"></p>
        <p class="status" id="gStatus" aria-live="polite">請出示此畫面給工作人員掃描</p>
      </div>
    </div>
    <p class="note">網路不穩時，也可以出示這個畫面的截圖讓工作人員掃描。</p>
    <button class="plain" id="reset">查詢其他團體</button>
  </section>
</main>

<script>
  const SITE = window.SITE_CONFIG;
  const $ = id => document.getElementById(id);
  const POLL_MS = Math.max(5, Number(SITE.POLL_SECONDS) || 5) * 1000;
  const TIMEOUT_MS = 20000;   // Apps Script 閒置後第一次呼叫要先喚醒，可能超過 8 秒
  const POLL_TIMEOUT_MS = 8000;
  const HEDGE_MS = 2500;
  // 查到的通行證存在手機裡，重新打開不必再等查詢（不存 Email）
  const STORE = 'twpride_checkin_pass';
  let current = null, timer = null;

  /* ---------- Apps Script API ---------- */
  async function apiOnce(action, data, timeoutMs, ctrl) {
    ctrl = ctrl || new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs || TIMEOUT_MS);
    try {
      const res = await fetch(SITE.API_URL, {
        method: 'POST',
        // text/plain 不會觸發 CORS 預檢
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action }, data)),
        redirect: 'follow',
        signal: ctrl.signal,
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally {
      clearTimeout(t);
    }
  }

  // Google 偶爾會在把請求交給 Apps Script 前卡住 20 秒左右（程式本身只跑 1 秒內）。
  // 前一個請求 HEDGE_MS 內沒回就再送一個相同的，誰先回用誰，最多同時 3 個。
  function apiRace(action, data) {
    return new Promise((resolve, reject) => {
      const ctrls = [];
      let settled = false, running = 0, sent = 0, lastErr = null, hedge = null;
      const end = (fn, v) => {
        if (settled) return;
        settled = true;
        clearTimeout(hedge);
        ctrls.forEach(c => c.abort());
        fn(v);
      };
      const launch = () => {
        if (settled || sent >= 3) return;
        sent++; running++;
        const ctrl = new AbortController();
        ctrls.push(ctrl);
        apiOnce(action, data, TIMEOUT_MS, ctrl).then(v => end(resolve, v), e => {
          running--; lastErr = e;
          if (sent < 3) launch();
          else if (!running) end(reject, lastErr);
        });
        clearTimeout(hedge);
        if (sent < 3) hedge = setTimeout(launch, HEDGE_MS);
      };
      launch();
    });
  }

  async function lookup(name, email) {
    $('go').disabled = true;
    $('go').textContent = '查詢中…';
    $('err').textContent = '';
    let res;
    try {
      res = await apiRace('lookupGroup', { name, email });
      if (res.error) throw new Error(res.error);
    } catch (e) {
      res = null;
    }
    $('go').disabled = false;
    $('go').textContent = '顯示報到 QR Code';
    if (!res) {
      $('err').textContent = '連線失敗，請確認網路後再試一次。';
      return;
    }
    if (!res.ok) {
      $('err').textContent = '找不到相符的資料。請確認團體名稱與報名 Email 都和報名時填寫的一致。';
      return;
    }
    savePass(res);
    showPass(res);
  }

  function savePass(res) {
    const keep = { event: SITE.EVENT_NAME, code: res.code, name: res.name, team: res.team, qrText: res.qrText, done: res.done, time: res.time };
    try { localStorage.setItem(STORE, JSON.stringify(keep)); } catch (e) {}
  }

  function loadPass() {
    try {
      const p = JSON.parse(localStorage.getItem(STORE) || 'null');
      return p && p.event === SITE.EVENT_NAME && p.code && p.qrText ? p : null;   // 不同年度的不沿用
    } catch (e) { return null; }
  }

  function showPass(res) {
    current = res;
    $('formView').hidden = true;
    $('passView').hidden = false;
    $('gName').textContent = res.name;
    setTeam(res.team);
    $('gCode').textContent = res.code;
    $('qr').innerHTML = '';
    new QRCode($('qr'), { text: res.qrText, width: 480, height: 480, correctLevel: QRCode.CorrectLevel.M });
    setDone(res.done, res.time);
    if (!res.done) schedule();
  }

  const TEAM_COLORS = [[/紅|red/i, '--r'], [/橙|橘|orange/i, '--o'], [/黃|yellow/i, '--y'], [/綠|green/i, '--g'], [/藍|blue/i, '--b'], [/紫|purple/i, '--p']];
  function setTeam(team) {
    const el = $('gTeam');
    el.hidden = !team;
    if (!team) return;
    el.textContent = team;
    const hit = TEAM_COLORS.find(t => t[0].test(team));
    el.style.background = hit ? 'var(' + hit[1] + ')' : 'var(--ink)';
    el.classList.toggle('light', !!hit && hit[1] === '--y');
  }

  function setDone(done, time) {
    $('pass').classList.toggle('done', !!done);
    $('gStatus').innerHTML = '';
    if (done) {
      $('gStatus').append('已完成報到');
      if (time) { const s = document.createElement('small'); s.textContent = '報到時間 ' + time; $('gStatus').append(s); }
    } else {
      $('gStatus').textContent = '請出示此畫面給工作人員掃描';
    }
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(poll, POLL_MS);
  }

  async function poll() {
    if (!current) return;
    if (document.hidden) { schedule(); return; }
    try {
      const s = await apiOnce('getStatus', { code: current.code }, POLL_TIMEOUT_MS);
      if (s.done) {
        setDone(true, s.time);
        savePass(Object.assign({}, current, { done: true, time: s.time }));
        if (navigator.vibrate) navigator.vibrate(200);
      }
      else schedule();
    } catch (e) {
      schedule();   // 這次卡住就等下一輪
    }
  }

  document.addEventListener('visibilitychange', () => { if (!document.hidden && current && !$('pass').classList.contains('done')) poll(); });

  $('go').addEventListener('click', () => {
    const name = $('name').value.trim(), email = $('email').value.trim();
    if (!name || !email) { $('err').textContent = '請填寫團體名稱與報名 Email。'; return; }
    lookup(name, email);
  });
  $('email').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

  $('reset').addEventListener('click', () => {
    clearTimeout(timer);
    current = null;
    try { localStorage.removeItem(STORE); } catch (e) {}
    $('passView').hidden = true;
    $('formView').hidden = false;
  });

  $('eventName').textContent = SITE.EVENT_NAME;
  try { sessionStorage.removeItem('twpride_checkin_lookup'); } catch (e) {}   // 舊版存的名稱與 Email
  const saved = loadPass();
  if (saved) {
    // 之前查過：直接顯示通行證，報到狀態在背景更新
    showPass(saved);
    if (!saved.done) poll();
  } else {
    // 一打開頁面就先喚醒 Apps Script（閒置後第一次呼叫要 8 秒以上），填資料時就醒好了
    apiOnce('getStatus', { code: '' }).catch(() => {});
  }
</script>
</body>
</html>
