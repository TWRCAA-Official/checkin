# 測試並部署 api/ 到 Azure App Service。
# 用 OIDC 登入 Azure（不存密碼），需要 repo 層級的 Actions 變數（不是機密）：
#   AZURE_CLIENT_ID、AZURE_TENANT_ID、AZURE_SUBSCRIPTION_ID、AZURE_WEBAPP_NAME
# 還沒設定這些變數時只跑測試，不部署。
# 設定步驟見 docs/azure-setup.md。

name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  deploy:
    needs: test
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # 沒有任何相依套件，直接打包原始碼；測試與本機工具不上傳
      - name: Package
        run: |
          mkdir -p dist
          cp -r api/package.json api/src dist/

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: dist

      - name: Health check
        run: |
          host=$(az webapp show --name "${{ vars.AZURE_WEBAPP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP || '內部系統' }}" --query defaultHostName -o tsv)
          for i in $(seq 1 12); do
            if curl -fsS "https://$host/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "health check failed" >&2
          exit 1
